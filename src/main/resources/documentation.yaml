openapi: "3.0.3"
info:
  title: Currency Quiz API
  description: >-
    Play the quiz anonymously and manage questions with an admin JWT.
    Public question responses never contain correct answers.
    JSON bodies are required for login, answers, creation, and updates.
  version: "1.0.0"
servers:
  - url: /
tags:
  - name: Quiz
  - name: Authentication
  - name: Administration
paths:
  /api/v1/questions:
    get:
      tags: [Quiz]
      operationId: listQuestions
      summary: List public questions
      responses:
        "200":
          description: Questions without correct answers. Initially an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicQuestion"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Administration]
      operationId: createQuestion
      summary: Create a question
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestion"
            example:
              text: Which currency is used in Japan?
              options: [USD, EUR, JPY, GBP]
              correctAnswer: JPY
      responses:
        "201":
          description: Created question, including its correct answer for the admin.
          headers:
            Location:
              description: URL of the public question resource.
              schema:
                type: string
                example: /api/v1/questions/58d6497e-227a-4bc4-938e-159f449df87e
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/questions/{id}:
    parameters:
      - $ref: "#/components/parameters/QuestionId"
    get:
      tags: [Quiz]
      operationId: getQuestion
      summary: Get a public question
      responses:
        "200":
          description: Question without its correct answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Administration]
      operationId: updateQuestion
      summary: Update part of a question
      description: >-
        Supply at least one field. Omitted or null fields retain their previous values.
        The merged question must be valid; changing options may require changing
        correctAnswer in the same request.
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestion"
            example:
              text: What is the currency of Japan?
      responses:
        "200":
          description: Updated question, including its correct answer for the admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Administration]
      operationId: deleteQuestion
      summary: Delete a question
      security:
        - adminBearer: []
      responses:
        "204":
          description: Question deleted. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/questions/{id}/answers:
    parameters:
      - $ref: "#/components/parameters/QuestionId"
    post:
      tags: [Quiz]
      operationId: submitAnswer
      summary: Check an answer
      description: >-
        Trims surrounding whitespace and ignores case when comparing answers.
        A valid but incorrect answer also returns 200 OK.
        Limited to 30 submissions per minute per client IP across all questions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
            example:
              answer: JPY
      responses:
        "200":
          description: Whether the answer is correct. Does not reveal the correct answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Obtain an admin access token
      description: >-
        Checks the configured admin username and password. Limited to 5 requests
        per minute per client IP. Use HTTPS outside local development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed admin access token with a configurable expiration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT returned by POST /api/v1/auth/login.
  parameters:
    QuestionId:
      name: id
      in: path
      required: true
      description: Question UUID. A malformed UUID produces 400; an unknown UUID produces 404.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid JSON, fields, question ID, or merged question.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Invalid credentials or a missing, expired, or invalid admin token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Question or route does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: Request Content-Type must be application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Per-client-IP rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Unexpected server error. Internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    PublicQuestion:
      type: object
      required: [id, text, options]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
        options:
          $ref: "#/components/schemas/Options"
    AdminQuestion:
      allOf:
        - $ref: "#/components/schemas/PublicQuestion"
        - type: object
          required: [correctAnswer]
          properties:
            correctAnswer:
              $ref: "#/components/schemas/CorrectAnswer"
    Options:
      type: array
      minItems: 2
      maxItems: 10
      uniqueItems: true
      description: Options must also be unique after trimming whitespace and ignoring case.
      items:
        type: string
        minLength: 1
        maxLength: 200
    CorrectAnswer:
      type: string
      minLength: 1
      maxLength: 200
      description: Must match one option after trimming whitespace and ignoring case.
    CreateQuestion:
      type: object
      additionalProperties: false
      required: [text, options, correctAnswer]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Surrounding whitespace is trimmed; the result must not be blank.
        options:
          $ref: "#/components/schemas/Options"
        correctAnswer:
          $ref: "#/components/schemas/CorrectAnswer"
    UpdateQuestion:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field must have a non-null value; the resulting question must be valid.
      properties:
        text:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
        options:
          type: array
          nullable: true
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 200
        correctAnswer:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          description: Must match a resulting option after trimming whitespace and ignoring case.
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 200
          description: Must not be blank after trimming. Does not have to match a listed option.
    AnswerResult:
      type: object
      required: [correct]
      properties:
        correct:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
          description: Token lifetime in seconds.
          example: 3600
    ApiError:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
          example: Request validation failed
        details:
          type: array
          description: Validation reasons; an empty array when no additional details are available.
          items:
            type: string
