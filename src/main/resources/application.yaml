ktor:
  deployment:
    host: 0.0.0.0
    port: "${PORT:8080}"
  application:
    modules:
      - info.remzi.currencyquiz.ApplicationKt.module

security:
  adminUsername: "${ADMIN_USERNAME:}"
  adminPassword: "${ADMIN_PASSWORD:}"
  jwtSecret: "${JWT_SECRET:}"
  jwtIssuer: "${JWT_ISSUER:currencyquiz-api}"
  jwtAudience: "${JWT_AUDIENCE:currencyquiz-admin}"
  tokenTtlSeconds: "${JWT_TOKEN_TTL_SECONDS:300}"
  adminAllowedOrigins: "${ADMIN_CORS_ALLOWED_ORIGINS:}"
  authCookieSecure: "${AUTH_COOKIE_SECURE:true}"
  authCookieSameSite: "${AUTH_COOKIE_SAME_SITE:Strict}"
  sessionIdleSeconds: "${ADMIN_SESSION_IDLE_SECONDS:900}"
  sessionAbsoluteSeconds: "${ADMIN_SESSION_ABSOLUTE_SECONDS:1800}"
cors:
  allowedOrigins: "${CORS_ALLOWED_ORIGINS:}"
storage:
  questionsFile: "${QUESTIONS_FILE:data/questions.json}"
