[versions]
dotenv = "6.5.1"
kotlin = "2.4.21"
logback = "1.6.5"
openapi-generator = "7.26.0"
openapi-validator = "3.0.0"

[libraries]
dotenv-kotlin = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
openapi-validator = { module = "com.atlassian.oai:openapi-request-validator-core", version.ref = "openapi-validator" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
